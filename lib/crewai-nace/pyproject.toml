[project]
name = "crewai-nace"
version = "0.1.0"
description = "CrewAI task guardrail, Flow router, and decide tool for Drex."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Nace", email = "alish@nace.ai" }]
dependencies = ["nace-sdk==0.4.0"]

[project.optional-dependencies]
crewai = ["crewai>=0.80"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
